<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Broadcaster + Remote Control</title>
</head>
<body>
  <h1>🖥️ PC Stream Broadcaster</h1>
  <button id="startBtn">Start Sharing Screen</button>
  <button id="reshareBtn" style="display:none;">🔄 Re‑share Screen</button>
  <p>Status: <span id="status">idle</span></p>
  <div id="previewContainer"></div>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    // Peer ID from URL parameter, default 'my-stream-key'
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'my-stream-key';
    // Resolution overrides: ?width=1920&height=1080
    const params = new URLSearchParams(location.search);
    const captureWidth = parseInt(params.get('width')) || 1920;
    const captureHeight = parseInt(params.get('height')) || 1080;
    const captureFps = parseInt(params.get('fps')) || 60;

    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const reshareBtn = document.getElementById('reshareBtn');
    const previewContainer = document.getElementById('previewContainer');

    let localStream = null;
    let peer = null;
    let ws = null;
    let activeCalls = [];
    let localVideoElement = null;
    let freezeCheckInterval = null;
    let lastStatsTimestamp = 0;
    let lastFramesSent = 0;
    let lastBytesSent = 0;

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:8765');
      ws.onopen = () => console.log('[Broadcaster] Connected to input server');
      ws.onerror = (e) => console.error('[Broadcaster] WebSocket error', e);
      ws.onclose = () => {
        console.log('[Broadcaster] WebSocket closed, retrying in 2s');
        setTimeout(connectWebSocket, 2000);
      };
    }
    connectWebSocket();

    function log(msg) {
      console.log('[Broadcaster]', msg);
    }

    async function replaceTrackForAllCalls(newTrack) {
      for (const call of activeCalls) {
        try {
          const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            await sender.replaceTrack(newTrack);
            log('Replaced track for a call');
          }
        } catch (err) {
          log('Failed to replace track: ' + err.message);
        }
      }
    }

    // Check WebRTC outbound video stats to detect freeze
    async function checkVideoStats() {
      if (!peer || activeCalls.length === 0) return;
      for (const call of activeCalls) {
        try {
          const stats = await call.peerConnection.getStats();
          let outboundVideo = null;
          stats.forEach(report => {
            if (report.type === 'outbound-rtp' && report.kind === 'video') {
              outboundVideo = report;
            }
          });
          if (!outboundVideo) continue;
          const framesSent = outboundVideo.framesSent || 0;
          const bytesSent = outboundVideo.bytesSent || 0;
          const now = performance.now();
          if (lastStatsTimestamp === 0) {
            lastStatsTimestamp = now;
            lastFramesSent = framesSent;
            lastBytesSent = bytesSent;
            continue;
          }
          const timeDelta = now - lastStatsTimestamp;
          if (timeDelta < 2000) continue; // check every 2s
          const framesDelta = framesSent - lastFramesSent;
          const bytesDelta = bytesSent - lastBytesSent;
          // If no frames sent and no bytes sent for 3 seconds, frozen
          if (framesDelta === 0 && bytesDelta === 0 && timeDelta > 3000) {
            log('❄️ Freeze detected via stats. Re‑sharing...');
            statusEl.textContent = 'Freeze detected. Re‑sharing...';
            await startScreenShare();
            const newTrack = localStream.getVideoTracks()[0];
            await replaceTrackForAllCalls(newTrack);
            statusEl.textContent = 'Screen capture restored.';
          }
          // Update baseline every check
          lastStatsTimestamp = now;
          lastFramesSent = framesSent;
          lastBytesSent = bytesSent;
        } catch (err) {
          log('Stats error: ' + err.message);
        }
      }
    }

    async function startScreenShare() {
      try {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        if (freezeCheckInterval) {
          clearInterval(freezeCheckInterval);
          freezeCheckInterval = null;
        }
        // Reset stats baselines
        lastStatsTimestamp = 0;
        lastFramesSent = 0;
        lastBytesSent = 0;

        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width: { ideal: captureWidth },
            height: { ideal: captureHeight },
            frameRate: { ideal: captureFps, max: captureFps }
          },
          audio: false
        });

        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.contentHint = 'detail'; // sharp image
          log('Video track settings: ' + JSON.stringify(videoTrack.getSettings()));

          videoTrack.onended = async () => {
            log('⚠️ Screen capture track ended. Restarting...');
            statusEl.textContent = 'Screen capture lost. Reconnecting...';
            await startScreenShare();
            const newTrack = localStream.getVideoTracks()[0];
            await replaceTrackForAllCalls(newTrack);
            statusEl.textContent = 'Screen capture restored.';
          };
        }

        // Update local preview
        previewContainer.innerHTML = '';
        localVideoElement = document.createElement('video');
        localVideoElement.srcObject = localStream;
        localVideoElement.autoplay = true;
        localVideoElement.muted = true;
        localVideoElement.playsInline = true;
        localVideoElement.style.width = '300px';
        previewContainer.appendChild(localVideoElement);

        // Start freeze detection using WebRTC stats (every 2 seconds)
        freezeCheckInterval = setInterval(checkVideoStats, 2000);

        statusEl.textContent = 'Screen captured. Initializing peer...';
        reshareBtn.style.display = 'inline-block';
        initPeer();
      } catch (err) {
        log('Screen capture failed: ' + err.message);
        statusEl.textContent = 'Error: ' + err.message;
      }
    }

    startBtn.addEventListener('click', startScreenShare);
    reshareBtn.addEventListener('click', async () => {
      await startScreenShare();
      await replaceTrackForAllCalls(localStream.getVideoTracks()[0]);
      statusEl.textContent = 'Screen re‑shared.';
    });

    function initPeer() {
      if (peer) {
        peer.destroy();
      }
      peer = new Peer(PEER_ID, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ],
          bundlePolicy: 'max-bundle'
        }
      });

      peer.on('open', (id) => {
        log('Peer ready, ID: ' + id);
        statusEl.textContent = `✅ Peer ready! ID: ${id} — waiting for viewers...`;
      });

      peer.on('call', (call) => {
        log('📞 Incoming media call');
        statusEl.textContent = 'Incoming call, answering...';

        const videoTrack = localStream?.getVideoTracks()[0];
        if (!videoTrack || videoTrack.readyState !== 'live') {
          log('❌ ERROR: No live video track!');
          statusEl.textContent = '❌ No screen capture active. Click Start Sharing Screen first.';
          call.close();
          return;
        }

        call.answer(new MediaStream([videoTrack]));
        activeCalls.push(call);

        call.on('close', () => {
          const idx = activeCalls.indexOf(call);
          if (idx > -1) activeCalls.splice(idx, 1);
          log('Viewer disconnected (media)');
          statusEl.textContent = 'Viewer disconnected';
        });
        call.on('error', (err) => {
          log('Media call error: ' + err.message);
        });

        // Set high bitrate after connection
        call.peerConnection.addEventListener('connectionstatechange', () => {
          if (call.peerConnection.connectionState === 'connected') {
            const sender = call.peerConnection.getSenders().find(s => s.track === videoTrack);
            if (sender) {
              const params = sender.getParameters();
              if (!params.encodings) params.encodings = [{}];
              params.encodings[0].maxBitrate = 25000000; // 25 Mbps
              params.encodings[0].minBitrate = 8000000;  // 8 Mbps
              params.encodings[0].networkPriority = 'high';
              sender.setParameters(params).catch(err => log('Could not set bitrate: ' + err));
              log('Bitrate set to high');
            }
          }
        });
      });

      // Data connection for remote control (unreliable)
      peer.on('connection', (conn) => {
        log('🔗 Data connection established from viewer');
        statusEl.textContent = 'Viewer connected (remote control ready)';

        conn.on('data', (data) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(data));
          } else {
            log('WebSocket not open, dropping data');
          }
        });

        conn.on('close', () => {
          log('Data connection closed');
          statusEl.textContent = 'Viewer data connection closed';
        });

        conn.on('error', (err) => {
          log('Data connection error: ' + err.message);
        });
      });

      peer.on('error', (err) => {
        log('Peer error: ' + err.message);
        statusEl.textContent = '❌ Peer error: ' + err.message;
      });
    }
  </script>
</body>
</html>
